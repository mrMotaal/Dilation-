    <script>
        function createGridSVG(minX, maxX, minY, maxY, shapes = [], scale = 24) {
            const pad = 32;
            const width = (maxX - minX) * scale + pad * 2;
            const height = (maxY - minY) * scale + pad * 2;
            const toX = x => pad + (x - minX) * scale;
            const toY = y => pad + (maxY - y) * scale;

            let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" style="background:#fff; border-radius:12px; border:1px solid #bae6fd; max-width:100%; height:auto;">`;

            for (let x = minX; x <= maxX; x++) {
                svg += `<line x1="${toX(x)}" y1="${toY(maxY)}" x2="${toX(x)}" y2="${toY(minY)}" stroke="#f8bbd0" stroke-width="1"/>`;
                if (x !== 0) {
                    svg += `<text x="${toX(x)}" y="${toY(0) + 14}" font-size="11" font-family="Nunito" font-weight="700" text-anchor="middle" fill="#334155">${x}</text>`;
                }
            }
            for (let y = minY; y <= maxY; y++) {
                svg += `<line x1="${toX(minX)}" y1="${toY(y)}" x2="${toX(maxX)}" y2="${toY(y)}" stroke="#f8bbd0" stroke-width="1"/>`;
                if (y !== 0) {
                    svg += `<text x="${toX(0) - 8}" y="${toY(y) + 4}" font-size="11" font-family="Nunito" font-weight="700" text-anchor="end" fill="#334155">${y}</text>`;
                }
            }

            svg += `<line x1="${toX(minX) - 10}" y1="${toY(0)}" x2="${toX(maxX) + 12}" y2="${toY(0)}" stroke="#db2777" stroke-width="2"/>`;
            svg += `<polygon points="${toX(maxX)+16},${toY(0)} ${toX(maxX)+8},${toY(0)-4} ${toX(maxX)+8},${toY(0)+4}" fill="#db2777"/>`;
            svg += `<line x1="${toX(0)}" y1="${toY(minY) + 10}" x2="${toX(0)}" y2="${toY(maxY) - 12}" stroke="#db2777" stroke-width="2"/>`;
            svg += `<polygon points="${toX(0)},${toY(maxY)-16} ${toX(0)-4},${toY(maxY)-8} ${toX(0)+4},${toY(maxY)-8}" fill="#db2777"/>`;

            svg += `<text x="${toX(maxX) + 14}" y="${toY(0) - 8}" font-size="13" font-family="serif" font-weight="bold" font-style="italic" fill="#0f172a">x</text>`;
            svg += `<text x="${toX(0) - 12}" y="${toY(maxY) - 10}" font-size="13" font-family="serif" font-weight="bold" font-style="italic" fill="#0f172a">y</text>`;
            svg += `<text x="${toX(0) - 10}" y="${toY(0) + 14}" font-size="12" font-family="serif" font-weight="bold" font-style="italic" fill="#0f172a">O</text>`;

            shapes.forEach(s => {
                const pts = s.points.map(p => `${toX(p[0])},${toY(p[1])}`).join(' ');
                svg += `<polygon points="${pts}" fill="${s.fill || 'rgba(2,132,199,0.12)'}" stroke="${s.stroke || '#0284c7'}" stroke-width="2" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/>`;
                s.points.forEach((p, idx) => {
                    svg += `<circle cx="${toX(p[0])}" cy="${toY(p[1])}" r="3.5" fill="${s.stroke || '#0284c7'}"/>`;
                    if (s.labels && s.labels[idx]) {
                        const dx = s.offsets && s.offsets[idx] ? s.offsets[idx][0] : 6;
                        const dy = s.offsets && s.offsets[idx] ? s.offsets[idx][1] : -6;
                        svg += `<text x="${toX(p[0]) + dx}" y="${toY(p[1]) + dy}" font-size="13" font-family="serif" font-weight="bold" font-style="italic" fill="${s.stroke || '#0f172a'}">${s.labels[idx]}</text>`;
                    }
                });
            });

            svg += `</svg>`;
            return svg;
        }

        const revisionData = [
            {
                section: "Dilation & Scale Factor",
                questions: [
                    {
                        q: "In the given figure:<br>Determine whether the dilation with center $C$ mapping $Q$ to $Q'$ is an enlargement or a reduction. Then find the dilation factor and the value of $x$.",
                        figure: `<div class="figure-box">
                            <svg width="310" height="230" viewBox="0 0 310 230" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <marker id="arr1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                        <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>

                                <line x1="250" y1="180" x2="145" y2="35" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr1)"/>
                                <line x1="250" y1="180" x2="250" y2="25" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr1)"/>
                                <polygon points="212,180 202,157 224,145 250,155" fill="rgba(2,132,199,0.12)" stroke="#0284c7" stroke-width="2"/>
                                <polygon points="136,180 106,112 172,75 250,105" fill="rgba(219,39,119,0.08)" stroke="#db2777" stroke-width="2"/>
                                <text x="255" y="193" font-family="serif" font-weight="bold" font-style="italic" font-size="16">C</text>
                                <text x="205" y="196" font-family="serif" font-weight="bold" font-style="italic" font-size="15" fill="#0284c7">Q</text>
                                <text x="128" y="196" font-family="serif" font-weight="bold" font-style="italic" font-size="15" fill="#db2777">Q'</text>
                                <text x="236" y="146" font-family="Nunito" font-weight="800" font-size="14" fill="#0f172a">4</text>
                                <text x="208" y="84" font-family="serif" font-weight="bold" font-style="italic" font-size="17" fill="#0f172a">x</text>
                                <text x="228" y="196" font-family="Nunito" font-weight="800" font-size="14" fill="#0f172a">5</text>
                                <line x1="136" y1="208" x2="250" y2="208" stroke="#475569" stroke-width="1.2"/>
                                <line x1="136" y1="203" x2="136" y2="213" stroke="#475569" stroke-width="1.2"/>
                                <line x1="250" y1="203" x2="250" y2="213" stroke="#475569" stroke-width="1.2"/>
                                <rect x="180" y="199" width="24" height="16" fill="white"/>
                                <text x="192" y="213" font-family="Nunito" font-weight="800" font-size="14" text-anchor="middle" fill="#0f172a">15</text>
                            </svg>
                        </div>`,
                        a: "$\\because Q \\in \\overline{CQ'}$<br>$\\therefore$ The dilation mapping $Q$ to $Q'$ is an <strong>enlargement</strong> with dilation factor $k$.<br>$$k = \\frac{CQ'}{CQ} = \\frac{15}{5} = 3$$<br>$$\\because \\frac{x}{4} = 3 \\implies x = 4 \\times 3 = 12$$"
                    },
                    {
                        tag: "Self-Evaluation",
                        q: "In the following figure:<br>Determine whether the dilation with center $C$ mapping $B$ to $B'$ is an enlargement or a reduction. Then find the dilation factor and the value of $x$.",
                        figure: `<div class="figure-box">
                            <svg width="290" height="210" viewBox="0 0 290 210" xmlns="http://www.w3.org/2000/svg">
                                <line x1="100" y1="175" x2="52" y2="30" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr1)"/>
                                <line x1="100" y1="175" x2="245" y2="30" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr1)"/>
                                <line x1="72" y1="91" x2="184" y2="91" stroke="#0284c7" stroke-width="2.5"/>
                                <line x1="63" y1="63" x2="212" y2="63" stroke="#db2777" stroke-width="2.5"/>
                                <line x1="100" y1="175" x2="72" y2="91" stroke="#0284c7" stroke-width="2"/>
                                <line x1="100" y1="175" x2="184" y2="91" stroke="#0284c7" stroke-width="2"/>
                                <line x1="72" y1="91" x2="63" y2="63" stroke="#db2777" stroke-width="2"/>
                                <line x1="184" y1="91" x2="212" y2="63" stroke="#db2777" stroke-width="2"/>
                                <text x="90" y="193" font-family="serif" font-weight="bold" font-style="italic" font-size="16">C</text>
                                <text x="188" y="102" font-family="serif" font-weight="bold" font-style="italic" font-size="15" fill="#0284c7">B</text>
                                <text x="216" y="72" font-family="serif" font-weight="bold" font-style="italic" font-size="15" fill="#db2777">B'</text>
                                <text x="135" y="55" font-family="serif" font-weight="bold" font-style="italic" font-size="17">x</text>
                                <text x="125" y="108" font-family="Nunito" font-weight="800" font-size="14">6.3</text>
                                <text x="145" y="148" font-family="Nunito" font-weight="800" font-size="14">6</text>
                                <line x1="115" y1="188" x2="225" y2="78" stroke="#475569" stroke-width="1.2"/>
                                <rect x="160" y="123" width="18" height="18" fill="white"/>
                                <text x="169" y="137" font-family="Nunito" font-weight="800" font-size="14" text-anchor="middle">8</text>
                            </svg>
                        </div>`,
                        a: "$\\because B \\in \\overline{CB'}$ and $CB' > CB$<br>$\\therefore$ The dilation mapping $B$ to $B'$ is an <strong>enlargement</strong>.<br>$$k = \\frac{CB'}{CB} = \\frac{8}{6} = \\frac{4}{3}$$<br>$$\\because \\frac{x}{6.3} = \\frac{4}{3} \\implies x = \\frac{6.3 \\times 4}{3} = 8.4$$"
                    },
                    {
                        q: "In the given figure:<br>$\\triangle ADE$ is the image of $\\triangle ABC$ under a dilation with center $A$. Find the dilation factor, and prove that $\\overline{DE} \\parallel \\overline{BC}$, and then find the length of $\\overline{BC}$.",
                        figure: `<div class="figure-box">
                            <svg width="260" height="210" viewBox="0 0 260 210" xmlns="http://www.w3.org/2000/svg">
                                <polygon points="130,25 65,180 215,180" fill="rgba(219,39,119,0.06)" stroke="#db2777" stroke-width="2"/>

                                <text x="185" y="122" font-family="serif" font-weight="bold" font-style="italic" font-size="15">E</text>
                                <text x="52" y="195" font-family="serif" font-weight="bold" font-style="italic" font-size="15">B</text>
                                <text x="215" y="195" font-family="serif" font-weight="bold" font-style="italic" font-size="15">C</text>
                                <text x="64" y="75" font-family="Nunito" font-weight="800" font-size="13">9 cm</text>
                                <text x="42" y="155" font-family="Nunito" font-weight="800" font-size="13">6 cm</text>
                                <text x="115" y="136" font-family="Nunito" font-weight="800" font-size="13">7.5 cm</text>
                            </svg>
                        </div>`,
                        a: "$\\because \\triangle ADE$ is the image of $\\triangle ABC$ under a dilation with center $A$<br>$\\therefore D$ is the image of $B$, and $AB = 9 + 6 = 15\\text{ cm}$.<br>$$k = \\frac{AD}{AB} = \\frac{9}{15} = \\frac{3}{5}$$<br>$\\because \\overline{DE}$ is the image of $\\overline{BC}$ under dilation $\\therefore \\overline{DE} \\parallel \\overline{BC}$.<br>$$\\because \\frac{DE}{BC} = k \\implies \\frac{7.5}{BC} = \\frac{3}{5} \\implies BC = \\frac{5 \\times 7.5}{3} = 12.5\\text{ cm}$$"
                    },
                    {
                        tag: "Self-Evaluation",
                        q: "In the following figure:<br>$\\triangle ABC$ is the image of $\\triangle ADE$ under a dilation with center $A$. Find the dilation factor, and prove that $\\overline{DE} \\parallel \\overline{BC}$, and then find the length of $\\overline{AC}$.",
                        figure: `<div class="figure-box">
                            <svg width="320" height="235" viewBox="0 0 320 235" xmlns="http://www.w3.org/2000/svg">
                                <polygon points="35,195 190,30 235,195" fill="rgba(219,39,119,0.06)" stroke="#db2777" stroke-width="2.2"/>
                                <line x1="101" y1="124" x2="121" y2="195" stroke="#db2777" stroke-width="2.2"/>
                                <text x="18" y="212" font-family="serif" font-weight="bold" font-style="italic" font-size="17" fill="#0f172a">A</text>
                                <text x="186" y="20" font-family="serif" font-weight="bold" font-style="italic" font-size="17" fill="#0f172a">B</text>
                                <text x="242" y="212" font-family="serif" font-weight="bold" font-style="italic" font-size="17" fill="#0f172a">C</text>
                                <text x="80" y="122" font-family="serif" font-weight="bold" font-style="italic" font-size="16" fill="#0f172a">D</text>
                                <text x="116" y="215" font-family="serif" font-weight="bold" font-style="italic" font-size="16" fill="#0f172a">E</text>
                                <text x="76" y="214" font-family="Nunito" font-weight="800" font-size="14" text-anchor="middle" fill="#0f172a">6 cm</text>
                                <text x="124" y="156" font-family="Nunito" font-weight="800" font-size="13.5" text-anchor="middle" transform="rotate(74.5 124,156)" fill="#0f172a">5.4 cm</text>
                                <text x="228" y="108" font-family="Nunito" font-weight="800" font-size="14" text-anchor="middle" transform="rotate(74.5 228,108)" fill="#0f172a">12.6 cm</text>
                            </svg>
                        </div>`,
                        a: "$\\because \\triangle ABC$ is the image of $\\triangle ADE$ under a dilation with center $A$<br>$$\\therefore \\text{Dilation factor } k = \\frac{BC}{DE} = \\frac{12.6}{5.4} = \\frac{7}{3}$$<br>$\\because \\overline{BC}$ is the image of $\\overline{DE}$ under dilation $\\therefore \\overline{DE} \\parallel \\overline{BC}$.<br>$$\\because \\frac{AC}{AE} = k \\implies \\frac{AC}{6} = \\frac{7}{3} \\implies AC = \\frac{6 \\times 7}{3} = 14\\text{ cm}$$"
                    }
                ]
            },
            {
                section: "Dilation in the Coordinate Plane",
                questions: [
                    {
                        q: "Draw $\\triangle ABC$ with vertices $A(1, 3), B(2, -1), C(5, 0)$ in the coordinate plane, then draw its image under a dilation with center $O$ and dilation factor $2$.",
                        figure: `<div class="figure-box">${createGridSVG(-1, 10, -2, 6, [], 22)}</div>`,
                        a: "The dilation rule with center $O$ and $k = 2$ is: $(x, y) \\longrightarrow (2x, 2y)$<br>• $A(1, 3) \\longrightarrow A'(2, 6)$<br>• $B(2, -1) \\longrightarrow B'(4, -2)$<br>• $C(5, 0) \\longrightarrow C'(10, 0)$<div class='figure-box'>" + createGridSVG(-1, 10, -2, 6, [

                        ], 22) + "</div>"

                                <text x="86" y="183" font-family="serif" font-weight="bold" font-style="italic" font-size="13">A</text>
                                <text x="97" y="18" font-family="Nunito" font-weight="800" font-size="13" text-anchor="middle">x cm</text>
                                <text x="116" y="61" font-family="Nunito" font-weight="800" font-size="13" text-anchor="middle">6 cm</text>
                                <text x="112" y="142" font-family="Nunito" font-weight="800" font-size="12" transform="rotate(-41 112,142)">9 cm</text>
                                <text x="68" y="180" font-family="Nunito" font-weight="800" font-size="12" transform="rotate(-41 68,180)">6 cm</text>
                            </svg>
                        </div>`,
                        a: "Since $OA = 9\\text{ cm}$ and $AA' = 6\\text{ cm}$, we have $OA' = 9 + 6 = 15\\text{ cm}$.<br>• <strong>Dilation Factor:</strong> $$k = \\frac{OA'}{OA} = \\frac{15}{9} = \\frac{5}{3}$$<br>• <strong>Type:</strong> Since $k > 1$, it is an <strong>enlargement</strong>.<br>• <strong>Value of $x$:</strong> $$\\frac{D'C'}{DC} = k \\implies \\frac{x}{6} = \\frac{5}{3} \\implies x = \\frac{6 \\times 5}{3} = 10\\text{ cm}$$"
                    },
                    {
                        q: "Draw in the coordinate plane the polygon and its image under a dilation with center $O$ and dilation factor $k$:<br>$A(2, -1), B(0, 3), C(-2, 1), k = 2$",
                        figure: `<div class="figure-box">${createGridSVG(-5, 5, -3, 7, [], 22)}</div>`,
                        a: "Rule: $(x, y) \\longrightarrow (2x, 2y)$<br>• $A(2, -1) \\longrightarrow A'(4, -2)$<br>• $B(0, 3) \\longrightarrow B'(0, 6)$<br>• $C(-2, 1) \\longrightarrow C'(-4, 2)$<div class='figure-box'>" + createGridSVG(-5, 5, -3, 7, [
                            { points: [[2,-1],[0,3],[-2,1]], labels: ['A','B','C'], stroke: '#0284c7', fill: 'rgba(2,132,199,0.12)' },
                            { points: [[4,-2],[0,6],[-4,2]], labels: ["A'","B'","C'"], stroke: '#db2777', fill: 'rgba(219,39,119,0.12)' }
                        ], 22) + "</div>"
                    },
                    {
                        q: "Draw in the coordinate plane the polygon and its image under a dilation with center $O$ and dilation factor $k$:<br>$A(-2, -4), B(2, 0), C(-4, 2), D(-6, -2), k = 0.5$",
                        figure: `<div class="figure-box">${createGridSVG(-7, 3, -5, 3, [], 22)}</div>`,
                        a: "Rule: $(x, y) \\longrightarrow (0.5x, 0.5y)$<br>• $A(-2, -4) \\longrightarrow A'(-1, -2)$<br>• $B(2, 0) \\longrightarrow B'(1, 0)$<br>• $C(-4, 2) \\longrightarrow C'(-2, 1)$<br>• $D(-6, -2) \\longrightarrow D'(-3, -1)$<div class='figure-box'>" + createGridSVG(-7, 3, -5, 3, [
                            { points: [[-2,-4],[2,0],[-4,2],[-6,-2]], labels: ['A','B','C','D'], stroke: '#0284c7', fill: 'rgba(2,132,199,0.1)' },
                            { points: [[-1,-2],[1,0],[-2,1],[-3,-1]], labels: ["A'","B'","C'","D'"], stroke: '#db2777', fill: 'rgba(219,39,119,0.15)' }
                        ], 22) + "</div>"
                    },
                    {
                        q: "In the given figure:<br>Draw the image of $\\triangle OAB$ under a dilation with center $O$ and rule $(x, y) \\longrightarrow \\left(\\frac{1}{3}x, \\frac{1}{3}y\\right)$.",
                        figure: `<div class="figure-box">${createGridSVG(-1, 7, -1, 7, [
                            { points: [[0,0],[6,3],[3,6]], labels: ['','A','B'], stroke: '#0284c7', fill: 'rgba(2,132,199,0.12)', offsets: [[0,0],[8,-4],[0,-8]] }
                        ], 26)}</div>`,
                        a: "From the graph, the vertices of $\\triangle OAB$ are $O(0, 0), A(6, 3), B(3, 6)$.<br>Applying the dilation rule $(x, y) \\longrightarrow \\left(\\frac{1}{3}x, \\frac{1}{3}y\\right)$:<br>• $O(0, 0) \\longrightarrow O(0, 0)$<br>• $A(6, 3) \\longrightarrow A'(2, 1)$<br>• $B(3, 6) \\longrightarrow B'(1, 2)$<div class='figure-box'>" + createGridSVG(-1, 7, -1, 7, [
                            { points: [[0,0],[6,3],[3,6]], labels: ['','A','B'], stroke: '#0284c7', fill: 'rgba(2,132,199,0.1)', offsets: [[0,0],[8,-4],[0,-8]] },
                            { points: [[0,0],[2,1],[1,2]], labels: ['',"A'","B'"], stroke: '#db2777', fill: 'rgba(219,39,119,0.18)', offsets: [[0,0],[8,-2],[-14,-4]] }
                        ], 26) + "</div>"
                    }
                ]
            }
        ];

        const appContainer = document.getElementById('app');
        let globalQuestionCounter = 1;

        const generateWorkspace = () => {
            let lines = '';
            for (let i = 0; i < 8; i++) lines += '<div class="writing-line"></div>';
            return `<div class="student-workspace">${lines}</div>`;
        };

        revisionData.forEach(sectionData => {
            const sectionHeader = document.createElement('h2');
            sectionHeader.className = 'section-title';
            sectionHeader.textContent = sectionData.section;
            appContainer.appendChild(sectionHeader);

            sectionData.questions.forEach(item => {
                const card = document.createElement('div');
                card.className = 'question-card';
                let optionsHTML = item.options && item.options.length > 0
                    ? `<div class="options-grid">` + item.options.map(opt => `<div class="option-item">${opt}</div>`).join('') + `</div>`
                    : '';
                let figureHTML = item.figure ? item.figure : '';
                let tagHTML = item.tag ? `<span class="self-eval-tag">${item.tag}</span>` : '';

                card.innerHTML = `
                    <div class="q-header-badges">
                        <div class="q-number">${globalQuestionCounter}</div>
                        ${tagHTML}
                    </div>
                    <div class="question-text">${item.q}</div>
                    ${figureHTML}
                    ${optionsHTML}
                    ${generateWorkspace()}
                    <button class="btn-toggle" onclick="toggleSolution(this)">Show Solution</button>
                    <div class="solution-box">${item.a}</div>
                `;
                appContainer.appendChild(card);
                globalQuestionCounter++;
            });
        });

        function toggleSolution(btn) {
            const solutionBox = btn.nextElementSibling;
            if (solutionBox.style.display === "block") {
                solutionBox.style.display = "none";
                btn.textContent = "Show Solution";
            } else {
                solutionBox.style.display = "block";
                btn.textContent = "Hide Solution";
            }
        }

        window.addEventListener("load", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        });
    </script>
</body>
</html>
